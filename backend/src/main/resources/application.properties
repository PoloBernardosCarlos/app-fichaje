spring.application.name=fichaje-api
server.port=8081

# MySQL (XAMPP). La base de datos se crea sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/fichaje_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
